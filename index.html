*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 一定要放在所有 display 宣告之前面對面壓過去：像 .rollbox 這種設了 display:flex 的
   class，優先度會蓋掉瀏覽器對 [hidden] 的 display:none，元素就藏不起來 */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
/* 中文字型只有 400/700 兩個字重，設 800 會觸發合成假粗體、筆畫糊掉，
   所以全站最粗只到 700，層級改用級距與顏色拉開。
   中文字體一定要排在 sans-serif 前面，否則 Windows 會掉到新細明體那種明體。 */
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,
    "PingFang TC","Hiragino Sans CNS","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Source Han Sans TC",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background-image:radial-gradient(120% 60% at 50% 0%, var(--bg-2) 0%, transparent 62%);
  background-repeat:no-repeat;
}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.app{max-width:480px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

/* ================= header ================= */
.top{display:flex;align-items:flex-end;gap:14px;padding:26px 2px 18px;position:relative}
/* 暖光用背景圖層疊在頭像「下面」，不要用 z-index:-1 的偽元素——
   這個元素有 filter，會建立 stacking context，負 z-index 反而會蓋在臉上 */
.top .mascot{
  width:92px;aspect-ratio:460/469;display:block;flex:0 0 auto;
  background:
    var(--nl) center/contain no-repeat,
    radial-gradient(closest-side, var(--brand-soft), transparent) center/104px 104px no-repeat;
  filter:drop-shadow(0 8px 10px rgba(59,45,29,.22));
  animation:idle 4.2s ease-in-out infinite;transform-origin:50% 70%;
}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
/* 背景音樂開關：瀏覽器不准有聲自動播放，所以真正開始播是在使用者第一次點畫面時 */
.bgm{
  position:absolute;right:2px;top:20px;width:38px;height:38px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1),var(--glass);
  display:grid;place-items:center;transition:transform .12s,background .15s,border-color .15s;
}
.bgm:active{transform:scale(.92)}
.bgm .ic{width:17px;height:17px;display:block;background:currentColor;color:var(--ink-3);
  -webkit-mask:var(--spk) center/contain no-repeat;mask:var(--spk) center/contain no-repeat}
.bgm[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.bgm[aria-pressed="true"] .ic{color:#3B2D1D;--spk:var(--spk-on)}
:root{
  --spk-on:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>');
  --spk-off:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>');
  --spk:var(--spk-off);
}
.top .ttl{padding-bottom:4px}
.top h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.03em;line-height:1.22}
.top p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55;letter-spacing:.01em}
.top .badge{
  display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep);
}

/* ================= cards ================= */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:20px;box-shadow:var(--sh-1),var(--glass);margin-bottom:13px;
}
.lbl{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;
  font-size:11.5px;font-weight:700;letter-spacing:.2em;color:var(--ink-3);
}
.lbl .now{font-size:14px;font-weight:700;letter-spacing:0;color:var(--ink)}

/* line chips */
.lines{display:flex;flex-wrap:wrap;gap:7px}
.lchip{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;
  background:var(--card-2);border:1.5px solid var(--line);font-size:13.5px;font-weight:700;
  letter-spacing:.02em;transition:transform .12s,border-color .15s,background .15s;
}
.lchip b{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.lchip:active{transform:scale(.95)}
.lchip[aria-pressed=true]{background:var(--c,var(--brand));border-color:var(--c,var(--brand));color:#fff}
.lchip[aria-pressed=true] b{background:#fff !important}
.lchip.any[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fset{margin-top:9px;padding-top:11px;border-top:1px dashed var(--line)}
.fchip{background:var(--card);border-style:dashed}
.fchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);border-style:solid;color:var(--bg)}
.fchip[aria-pressed=true]::before{content:"✓ ";font-weight:700}

/* 出發站：路線 + 車站 兩段式下拉 */
.picker{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}
.picker .selwrap select{padding-right:34px;font-size:15.5px}
.picker .selwrap:last-child select{font-size:17px}
.selwrap{position:relative}
.selwrap select{
  width:100%;padding:16px 44px 16px 16px;border-radius:15px;
  background:var(--card-2);border:1.5px solid var(--line);color:var(--ink);
  font:inherit;font-size:17px;font-weight:700;letter-spacing:.02em;
  -webkit-appearance:none;appearance:none;cursor:pointer;
}
.selwrap .chev{position:absolute;right:17px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3);font-size:13px}
.selwrap select optgroup{font-size:14px;font-weight:700;color:var(--ink-2);background:var(--card)}
.selwrap select option{font-size:16px;font-weight:600;color:var(--ink);background:var(--card)}
.geo{
  width:100%;margin-top:12px;padding:12px;border-radius:14px;border:1.5px dashed var(--line);
  background:var(--card-2);font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;
}
.geohint{
  margin:9px 2px 0;font-size:11.5px;line-height:1.7;color:var(--ink-3);letter-spacing:.01em;
}
.geohint b{color:var(--ink-2);font-weight:700}

/* slider */
.mins{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.mins .n{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
.mins .u{font-size:14.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
/* 雙拉桿：兩個 range 疊在同一條軌道上。input 本身不吃指標事件，
   只有把手吃，這樣兩個把手才能各自被抓住。 */
.rng2{position:relative;height:36px;margin:16px 0 4px}
.rng2 .track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.rng2 .fill{position:absolute;top:0;bottom:0;background:var(--brand);border-radius:99px}
.rng2 input{
  position:absolute;left:0;top:0;width:100%;height:36px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;
}
.rng2 input:focus{outline:none}
.rng2 input:focus-visible::-webkit-slider-thumb{outline:3px solid var(--focus);outline-offset:2px}
.rng2 input::-webkit-slider-runnable-track{height:36px;background:transparent;border:none}
.rng2 input::-moz-range-track{height:36px;background:transparent;border:none}
.rng2 input::-webkit-slider-thumb{
  -webkit-appearance:none;pointer-events:auto;width:30px;height:30px;border-radius:50%;margin-top:3px;
  background:var(--card);border:4px solid var(--brand);box-shadow:var(--sh-1);cursor:grab;
}
.rng2 input::-moz-range-thumb{
  pointer-events:auto;width:26px;height:26px;border-radius:50%;
  background:var(--card);border:4px solid var(--brand);box-shadow:var(--sh-1);cursor:grab;
}
.rng2 input:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.07)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);padding:0 2px}

/* go */
.go{
  width:100%;padding:20px;border-radius:20px;color:#3B2D1D;
  background:linear-gradient(180deg,#FFD164,var(--brand));
  font-size:19px;font-weight:700;letter-spacing:.32em;text-indent:.32em;
  box-shadow:0 5px 0 var(--brand-deep), var(--sh-2);transition:transform .09s,box-shadow .09s;
}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-deep)}
.go[disabled]{opacity:.5}
.pool{text-align:center;font-size:12.5px;color:var(--ink-3);margin:10px 0 0;min-height:1.3em}

/* ================= result ================= */
#result[hidden]{display:none}
.rollbox{
  background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:var(--sh-2);display:flex;flex-direction:column;align-items:center;
  padding:22px 18px 24px;text-align:center;
}
/* 去背後的奶龍直接站在卡片上，底下墊一圈暖光當舞台 */
.rollbox .stage{position:relative;display:grid;place-items:end center;padding-bottom:6px}
.rollbox .stage::before{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:112px;height:26px;border-radius:50%;
  background:radial-gradient(closest-side, var(--brand-soft), transparent);
}
.rollbox .stage img{
  position:relative;width:152px;height:auto;display:block;
  filter:drop-shadow(0 12px 10px rgba(59,45,29,.26));
}
.rollbox .flick{margin-top:14px;font-size:30px;font-weight:700;letter-spacing:.06em;opacity:.75}
.rollbox .cue{margin-top:4px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--ink-3)}

.tk{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh-2);animation:rise .42s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.tk-bar{display:flex;height:7px}
.tk-bar i{flex:1}
.tk-top{padding:20px 18px 18px;text-align:center;position:relative}
.codes{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.rd{
  display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;padding:0 9px;
  border-radius:50%;border:3px solid var(--c);color:var(--c);font-size:14px;font-weight:700;
  letter-spacing:.02em;background:var(--card);box-shadow:var(--sh-1);
}
.tk-top h2{margin:14px 0 0;font-size:clamp(32px,8.8vw,40px);font-weight:700;letter-spacing:.015em;line-height:1.18}
.tk-top .en{margin:4px 0 0;font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.tk-top .vibe{margin:12px auto 0;max-width:24em;font-size:14px;line-height:1.7;color:var(--ink-2)}

.stats{display:flex;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--card-2)}
.st{flex:1;padding:15px 4px;text-align:center}
.st+.st{border-left:1px solid var(--line-2)}
.st .n{display:block;font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.st .k{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink-3);margin-top:4px}

/* route steps */
.route{padding:18px 18px 6px}
.route h3{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--ink-3)}
.leg{display:flex;gap:12px;padding-bottom:14px;position:relative}
.leg:last-child{padding-bottom:2px}
.leg .rail{flex:0 0 auto;width:14px;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.leg .rail .dot{width:13px;height:13px;border-radius:50%;background:var(--c);flex:0 0 auto;box-shadow:0 0 0 3px var(--card), 0 0 0 4.5px var(--c)}
.leg .rail .bar{flex:1;width:5px;border-radius:9px;background:var(--c);margin:4px 0 -6px;min-height:16px}
.leg.xfer .rail .bar{background:repeating-linear-gradient(180deg,var(--ink-3) 0 4px,transparent 4px 8px);width:3px}
.leg .body{flex:1;min-width:0;padding-bottom:2px}
.leg .ln{font-size:14.5px;font-weight:700;line-height:1.45;letter-spacing:.01em}
.leg .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;letter-spacing:.01em}
.leg .sub b{color:var(--ink);font-weight:700}
.xbadge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-deep);margin-bottom:5px}

.more{
  display:flex;align-items:center;gap:12px;width:100%;padding:18px;
  border-top:1px solid var(--line-2);background:var(--card-2);text-align:left;
}
.more .t{flex:1;font-size:15.5px;font-weight:700;letter-spacing:.02em}
.more .s{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px;letter-spacing:.02em}
.more .ar{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--brand);color:#3B2D1D;font-size:15px;font-weight:700;box-shadow:var(--sh-1);
}
.more:active{background:var(--brand-soft)}
.again{display:flex;gap:9px;margin-top:12px}
.again button{flex:1;padding:14px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14.5px;box-shadow:var(--sh-1)}
.again button:active{transform:scale(.97)}

/* ================= sheet ================= */
.scrim{position:fixed;inset:0;background:rgba(30,22,12,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80;backdrop-filter:blur(2px)}
.scrim[data-on="1"]{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:88vh;
  background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--sh-3);
  transform:translateY(101%);transition:transform .36s cubic-bezier(.3,1.1,.4,1);
  display:flex;flex-direction:column;
}
.sheet[data-on="1"]{transform:translateY(0)}
.sh-head{padding:10px 18px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sh-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1.35}
.sh-head p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.65;padding-right:34px}
.sh-x{position:absolute;right:12px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink-2)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px calc(26px + env(safe-area-inset-bottom));flex:1}
.sh-inner{max-width:480px;margin:0 auto}

.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.18em}
.sec-h .ic{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;font-size:12px}
.sec-h::after{content:"";flex:1;border-top:1px solid var(--line)}
.spot .ic{background:var(--brand-soft);color:var(--brand-deep)}
.food .ic{background:var(--coral-soft);color:var(--coral)}
.rec{display:flex;gap:13px;padding:15px 16px;border-radius:17px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;box-shadow:var(--sh-1),var(--glass)}
.rec .i{flex:0 0 auto;width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:700;margin-top:2px}
.spot .rec .i{background:var(--brand-soft);color:var(--brand-deep)}
.food .rec .i{background:var(--coral-soft);color:var(--coral)}
.rec .t{margin:0;font-size:16px;font-weight:700;line-height:1.45;letter-spacing:.01em}
.rec .d{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.75}
.rec .g{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-3)}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.out{
  padding:15px 10px;border-radius:16px;text-decoration:none;text-align:center;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  font-size:14px;font-weight:700;letter-spacing:.03em;box-shadow:var(--sh-1),var(--glass);
}
.out.wide{grid-column:1/-1}
.out.xhs{color:var(--coral);border-color:var(--coral-soft)}
.out:active{transform:scale(.97)}

/* history + footer */
.hist{margin-top:6px}
.hist h2{font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);margin:0 0 10px}
.hl{display:flex;flex-wrap:wrap;gap:7px;padding:0;margin:0;list-style:none}
.hl button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.hl b{width:8px;height:8px;border-radius:50%}
.clr{margin-top:11px;font-size:12px;color:var(--ink-3);text-decoration:underline}
footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.9;letter-spacing:.01em}
footer p{margin:0 0 8px}
footer b{color:var(--ink-2);font-weight:700}
</style>

/* Dijkstra over (station, service)，回傳每站最佳 {sec, hops, xfers, path} */
function plan(from){
  const dist=new Map(), prev=new Map(), best=new Map();
  const key=(n,s)=>n+"␀"+s;
  const pq=[];
  const push=o=>{let lo=0,hi=pq.length;while(lo<hi){const m=(lo+hi)>>1;if(pq[m].c<o.c)lo=m+1;else hi=m}pq.splice(lo,0,o)};
  (ADJ.get(from)||[]).forEach(e=>{
    const k=key(from,e.svc);
    if(!dist.has(k)){dist.set(k,0);push({n:from,s:e.svc,c:0,sec:0,h:0,x:0});}
  });
  while(pq.length){
    const cur=pq.shift(), k=key(cur.n,cur.s);
    if(cur.c>(dist.get(k)??Infinity))continue;
    const prevBest=best.get(cur.n);
    if(cur.n!==from&&(!prevBest||cur.sec<prevBest.sec)) best.set(cur.n,{sec:cur.sec,hops:cur.h,xfers:cur.x,key:k});
    for(const e of ADJ.get(cur.n)||[]){
      const change=e.svc!==cur.s;
      const add=e.sec+(DWELL.get(e.to)||0);
      const nc=cur.c+add+(change?XFER_PENALTY:0);
      const nk=key(e.to,e.svc);
      if(nc<(dist.get(nk)??Infinity)){
        dist.set(nk,nc); prev.set(nk,{k,n:cur.n,svc:e.svc});
        push({n:e.to,s:e.svc,c:nc,sec:cur.sec+add,h:cur.h+1,x:cur.x+(change?1:0)});
      }
    }
  }
  return {best,prev,from};
}
/* 還原路徑 -> legs */
function legsOf(pl,dest){
  const b=pl.best.get(dest); if(!b)return null;
  const steps=[]; let k=b.key;
  while(pl.prev.has(k)){const p=pl.prev.get(k);const n=k.slice(0,k.indexOf("␀"));steps.push({from:p.n,to:n,svc:p.svc});k=p.k;}
  steps.reverse();
  const legs=[];
  for(const s of steps){
    const last=legs[legs.length-1];
    if(last&&last.svc===s.svc){last.to=s.to;last.n++;}
    else legs.push({svc:s.svc,from:s.from,to:s.to,n:1});
  }
  return legs.map(l=>{
    const sv=SVC[l.svc], lk=sv.line, li=LINE[lk];
    const pf=sv.pos.get(l.from), pt=sv.pos.get(l.to);
    const dir=pt>pf?sv.order[sv.order.length-1]:sv.order[0];
    return {from:l.from,to:l.to,n:l.n,line:li.n,short:li.s,color:li.c,key:lk,dir};
  });
}

  if(d<0.09) return "就在旁邊";
  if(d<1) return "約 "+(Math.round(d*1000/10)*10)+" 公尺";
  return "約 "+d.toFixed(1)+" 公里";
}

function renderFromLineSel(){
  const sel=$("fromline");
  sel.innerHTML=`<option value="ALL">全部路線</option>`+
    PICK.map(l=>`<option value="${l.k}">${l.n}線</option>`).join("");
  sel.value=fromLineFilter;
}
function opt(v,label){const o=document.createElement("option");o.value=v;o.textContent=label;return o;}

function renderFrom(){
  const sel=$("from"); sel.innerHTML="";
  if(fromLineFilter==="ALL"){
    const near=nearestList(5);
    if(near.length){
      const g=document.createElement("optgroup"); g.label="📍 離你最近";
      near.forEach(([n,d])=>g.appendChild(opt(n,`${n} · ${fmtKm(d)}`)));
      sel.appendChild(g);
    }
    PICK.forEach(l=>{
      const g=document.createElement("optgroup"); g.label=l.n+"線";
      lineStations(l.k).forEach(n=>g.appendChild(opt(n,n)));
      sel.appendChild(g);
    });
  }else{
    const stns=lineStations(fromLineFilter);
    /* 選了線之後，若目前的站不在這條線上，就跳到這條線的第一站 */
    if(!stns.includes(fromStn)){ fromStn=stns[0]; pl=null; }
    const dist=Object.fromEntries(nearestList(999));
    stns.forEach(n=>sel.appendChild(opt(n, dist[n]!=null&&dist[n]<1.2 ? `${n} · ${fmtKm(dist[n])}` : n)));
  }
  sel.value=fromStn;
}
function renderToLines(){
  $("to-lines").innerHTML=
    `<button class="lchip any" type="button" data-k="ANY" aria-pressed="${toLine==="ANY"}">🎲 都可以</button>`+
    PICK.map(l=>`<button class="lchip" type="button" data-k="${l.k}" style="--c:${l.c}" aria-pressed="${l.k===toLine}"><b style="background:${l.c}"></b>${l.n}</button>`).join("");
}
$("fromline").addEventListener("change",e=>{fromLineFilter=e.target.value;renderFrom();refresh();});
$("from").addEventListener("change",e=>{fromStn=e.target.value;pl=null;refresh();});
$("to-lines").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;
  toLine=b.dataset.k;renderToLines();refresh();});

const rmin=$("rmin"), rmax=$("rmax"), fill=$("fill");
const TOP=65;   /* 拉到底 = 不限 */
function syncRange(who){
  let a=+rmin.value, b=+rmax.value;
  if(who==="min" && a>b-5){ a=Math.max(0,b-5); rmin.value=a; }
  if(who==="max" && b<a+5){ b=Math.min(TOP,a+5); rmax.value=b; }
  if(a>b-5){ a=Math.max(0,b-5); rmin.value=a; }
  minMin=a; maxMin = b>60 ? 999 : b;

  const L=a/TOP*100, R=b/TOP*100;
  fill.style.left=L+"%"; fill.style.width=(R-L)+"%";
  /* 兩個把手靠很近時，讓下限那顆浮到上面才抓得到 */
  rmin.style.zIndex = a>=45 ? 5 : 3;
  rmax.style.zIndex = 4;

  const n=$("min-n"), u=$("min-u");
  if(a===0 && b>60){ n.textContent="∞";        u.textContent="不限，隨便奶龍"; }
  else if(a===0)   { n.textContent=b;          u.textContent="分鐘以內"; }
  else if(b>60)    { n.textContent=a;          u.textContent="分鐘以上"; }
  else             { n.textContent=a+"–"+b;    u.textContent="分鐘"; }
  refresh();
}
rmin.addEventListener("input",()=>syncRange("min"));
rmax.addEventListener("input",()=>syncRange("max"));

function candidates(){
  if(!pl) pl=plan(fromStn);
  let out=[];
  for(const [n,v] of pl.best){
    const m=v.sec/60;
    if(m>maxMin || m<minMin) continue;
    if(toLine!=="ANY"){
      const keys=ST.get(n).keys;
      if(!(keys.has(toLine)||[...keys].some(k=>MERGE[k]===toLine))) continue;
    }
    if(hotOnly){ if(!HOT.has(n)) continue; }       /* 只抽熱門優先於排除偏鄉 */
    else if(noRural && RURAL.has(n)) continue;
    out.push(n);
  }
  const fresh=out.filter(n=>!drawn.has(n));
  return fresh.length?fresh:out;
}
function refresh(){
  const n=candidates().length;
  $("pool").textContent = n ? `符合條件的有 ${n} 站` : "這個條件下沒有站，把時間放寬或取消篩選吧";
  $("go").disabled = n===0;
}
$("to-filters").addEventListener("click",e=>{
  const b=e.target.closest("[data-f]"); if(!b) return;
  const on=b.getAttribute("aria-pressed")!=="true";
  b.setAttribute("aria-pressed",on);
  if(b.dataset.f==="hot") hotOnly=on; else noRural=on;
  refresh();
});

/* ---- 抽 ---- */
function draw(){
  const list=candidates(); if(!list.length){refresh();return;}
  const pick=list[Math.floor(Math.random()*list.length)];
  $("go").disabled=true;
  $("result").hidden=false;
  $("tkslot").innerHTML="";
  $("rollbox").hidden=false;
  $("result").scrollIntoView({behavior:"smooth",block:"center"});
  const fl=$("fl"); let t=0;
  const spin=setInterval(()=>{
    fl.textContent=NAMES[Math.floor(Math.random()*NAMES.length)];
    if(++t>14){
      clearInterval(spin);
      fl.textContent=pick;          /* 停在真正抽到的那一站，不要跳完就換人 */
      setTimeout(()=>{
        $("rollbox").hidden=true;
        show(pick); $("go").disabled=false;
      },430);
    }
  },60);
}

function show(name){
  const b=pl.best.get(name), legs=legsOf(pl,name), r=ST.get(name), d=D[name];
  const cols=colorsOf(name);
  cur=name; drawn.add(name);
  const legHtml=legs.map((l,i)=>{
    const mk=k=>MERGE[k]||k;
    const xf=i>0?`<span class="xbadge">${mk(legs[i-1].key)===mk(l.key)?"同線換車":"轉乘"} · ${l.from}</span>`:"";
    return `<div class="leg${i>0?" ":""}" style="--c:${l.color}">
      <div class="rail"><span class="dot"></span><span class="bar"></span></div>
      <div class="body">${xf}<div class="ln">${l.line} 往 ${l.dir}</div>
      <div class="sub"><b>${l.from}</b> → <b>${l.to}</b> · ${l.n} 站</div></div></div>`;
  }).join("");

  $("rollbox").hidden=true;
  $("tkslot").innerHTML=`
  <article class="tk">
    <div class="tk-bar">${cols.map(c=>`<i style="background:${c}"></i>`).join("")}</div>
    <div class="tk-top">
      <div class="codes">${r.codes.map(c=>`<span class="rd mono" style="--c:${c.c}">${c.code}</span>`).join("")}</div>
      <h2>${name}</h2>
      <p class="en mono">${EN[name]||""}</p>
      ${d?`<p class="vibe">${d.v}</p>`:""}
    </div>
    <div class="stats">
      <div class="st"><span class="n mono">${rideMin(b.sec)}</span><span class="k">分鐘乘車</span></div>
      <div class="st"><span class="n mono">${b.hops}</span><span class="k">站</span></div>
      <div class="st"><span class="n mono">${b.xfers}</span><span class="k">次轉乘</span></div>
    </div>
    <div class="route"><h3>怎麼去</h3>${legHtml}</div>
    <button class="more" id="more" type="button">
      <div><div class="t">看奶龍推薦什麼</div><div class="s">${d?`${d.s.length} 個景點 · ${d.f.length} 個美食`:"搜尋連結"}</div></div>
      <span class="ar">→</span>
    </button>
  </article>
  <div class="again"><button type="button" id="re">再抽一站</button><button type="button" id="near">從這站再抽</button></div>`;
  $("result").hidden=false;

  $("more").addEventListener("click",()=>openSheet(name));
  $("re").addEventListener("click",draw);
  $("near").addEventListener("click",()=>{
    fromStn=name; pl=null;
    fromLineFilter="ALL"; renderFromLineSel(); renderFrom();
    refresh(); draw();
  });
  renderHist(); refresh();
}

/* ---- 推薦 sheet ---- */
function openSheet(name){
  const d=D[name];
  $("sh-t").textContent=name;
  $("sh-s").textContent=d?d.v:"還沒寫進口袋名單的一站，用下面的搜尋挖挖看。";
  const rec=(a,i)=>`<div class="rec"><span class="i">${i+1}</span><div><p class="t">${a[0]}</p><p class="d">${a[1]}</p>${a[2]?`<span class="g">${a[2]}</span>`:""}</div></div>`;
  const tag=name.replace(/[^\p{L}\p{N}]/gu,"");
  $("sh-body").innerHTML=
    (d?`<section class="sec spot"><h3 class="sec-h"><span class="ic">◎</span>去這裡走走</h3>${d.s.map(rec).join("")}</section>
        <section class="sec food"><h3 class="sec-h"><span class="ic">◍</span>順便吃這個</h3>${d.f.map(rec).join("")}</section>`:"")+
    `<div class="outs">
      <a class="out xhs" target="_blank" rel="noopener noreferrer" href="https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(name+" 美食")}">小紅書筆記</a>
      <a class="out" target="_blank" rel="noopener noreferrer" href="https://www.instagram.com/explore/tags/${encodeURIComponent(tag)}">IG 打卡</a>
      <a class="out wide" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+"捷運站")}">在地圖上看這一站</a>
    </div>`;
  $("sheet").dataset.on="1"; $("scrim").dataset.on="1";
  document.body.style.overflow="hidden";
}
function closeSheet(){$("sheet").dataset.on="0";$("scrim").dataset.on="0";document.body.style.overflow="";}
$("scrim").addEventListener("click",closeSheet);
$("sh-x").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ---- 歷史 ---- */
function renderHist(){
  if(!drawn.size){$("hist").hidden=true;return;}
  $("hist").hidden=false;
  $("hl").innerHTML=[...drawn].reverse().map(n=>
    `<li><button type="button" data-n="${n}"><b style="background:${colorsOf(n)[0]}"></b>${n}</button></li>`).join("");
}
$("hl").addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b)return;
  if(!pl)pl=plan(fromStn); if(pl.best.has(b.dataset.n)) show(b.dataset.n);});
$("clr").addEventListener("click",()=>{drawn.clear();renderHist();refresh();});

/* ---- 定位：把最近的站放到下拉最前面 ---- */
const GEO_IDLE="📍 幫我抓最近的站";
const inFrame = window.self !== window.top;
/* 頁面被嵌在跨網域 iframe 裡時，除非外框寫了 allow="geolocation"，
   否則瀏覽器一律拒絕定位——手機的定位有沒有開都一樣。先查得出來就先講清楚。 */
function geoBlockedByFrame(){
  try{
    if(!inFrame) return false;
    if(document.featurePolicy && document.featurePolicy.allowsFeature)
      return !document.featurePolicy.allowsFeature("geolocation");
  }catch(e){}
  return inFrame;
}
function hint(html){
  const h=$("geohint");
  if(!html){ h.hidden=true; return; }
  h.innerHTML=html; h.hidden=false;
}
function locate(silent){
  const btn=$("geo");
  if(!navigator.geolocation){
    if(!silent){ btn.textContent="這台裝置不支援定位"; hint("直接用上面的下拉選站就好。"); }
    return;
  }
  if(!silent){ btn.textContent="定位中…"; hint(null); }
  navigator.geolocation.getCurrentPosition(p=>{
    coords=[p.coords.latitude,p.coords.longitude];
    const top=nearestList(1)[0];
    if(top){ fromStn=top[0]; pl=null; fromLineFilter="ALL"; }
    renderFromLineSel(); renderFrom(); refresh();
    btn.textContent="📍 重新定位"; hint(null);
  },err=>{
    if(silent) return;                       /* 開頁自動那次失敗就安靜退場 */
    if(err.code===1){
      if(geoBlockedByFrame()){
        btn.textContent="這個框不給定位";
        hint("你的手機定位是好的，是<b>這個頁面被嵌在外框裡</b>，瀏覽器才不給它定位。把上面的網址<b>複製到瀏覽器開新分頁</b>就會問你要不要允許；或直接用下拉選站。");
      }else{
        btn.textContent="定位權限被拒";
        hint("到網址列旁邊的<b>鎖頭圖示 → 網站設定 → 位置</b>改成允許，再按一次。");
      }
    }else if(err.code===3){
      btn.textContent="定位逾時，再按一次";
      hint("GPS 還沒回訊號，通常再按一次就好。");
    }else{
      btn.textContent="抓不到位置訊號";
      hint("室內或地下街收不到訊號很正常，直接用下拉選站吧。");
    }
    setTimeout(()=>btn.textContent=GEO_IDLE,4000);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:600000});
}
$("geo").addEventListener("click",()=>locate(false));

/* ---- 背景音樂 ----
   瀏覽器禁止有聲自動播放，所以流程是：預設想播 -> 先試一次（多半會被擋）
   -> 被擋就等使用者第一次點畫面時再開始。喇叭鈕可隨時開關，選擇會記住。 */
(function(){
  const btn=$("bgm"), au=$("bgmAudio");
  if(!btn||!au) return;                    /* 沒有放音檔就整組不存在 */
  let want=true;
  try{ const s=localStorage.getItem("nailong-bgm"); if(s!==null) want = s==="1"; }catch(e){}
  au.volume=0.45;

  const paint=()=>btn.setAttribute("aria-pressed", want && !au.paused ? "true":"false");
  function tryPlay(){
    if(!want) return Promise.resolve();
    return au.play().then(paint).catch(()=>{});   /* 被擋就安靜等下一次互動 */
  }
  function arm(){
    const once=()=>{ tryPlay(); document.removeEventListener("pointerdown",once); };
    document.addEventListener("pointerdown",once,{once:true});
  }
  btn.addEventListener("click",e=>{
    e.stopPropagation();
    want=!want;
    try{ localStorage.setItem("nailong-bgm", want?"1":"0"); }catch(e){}
    if(want) au.play().then(paint).catch(paint); else { au.pause(); paint(); }
  });
  au.addEventListener("play",paint); au.addEventListener("pause",paint);
  paint(); tryPlay(); arm();
})();

$("go").addEventListener("click",draw);
renderFromLineSel();renderFrom();renderToLines();syncRange("init");
locate(true);  /* 開頁先靜靜試一次，被拒絕也不吵 */
</script>
